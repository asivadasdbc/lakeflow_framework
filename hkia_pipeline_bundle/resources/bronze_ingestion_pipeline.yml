resources:
  pipelines:
    lakeflow_hkia_egate_pipeline:
      name: Bronze Ingestion Pipeline - HKIA E-Gate (${var.logical_env})
      channel: CURRENT
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      libraries:
        - notebook:
            path: ${var.framework_source_path}/dlt_pipeline

      configuration:
        bundle.sourcePath: ${workspace.file_path}/src/dataflows/hkia_ingestion_flows/
        bundle.target: ${bundle.target}
        framework.sourcePath: ${var.framework_source_path}
        workspace.host: ${var.workspace_host}
        pipeline.layer: ${var.layer}
        logicalEnv: ${var.logical_env}
        pipeline.dataFlowGroupFilter: hkia_ingestion_flows
      root_path: ${workspace.file_path}/src/dataflows/hkia_ingestion_flows
